name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build bridge and game DLL
        run: cargo build --release --locked --workspace
      - name: Probe actual DLL with mock SCS host
        run: python scripts/probe_plugin.py target/release/stalkshift_plugin.dll
      - name: Inspect synthetic capture
        run: ./target/release/stalkshift.exe inspect fixtures/synthetic-transition.jsonl
      - name: Decode measured MOZA indicator sequence
        run: ./target/release/stalkshift.exe decode-indicators fixtures/moza/direct-indicators.jsonl
      - name: Package player release
        run: python scripts/package-release.py
      - name: Test packaged installer
        run: python scripts/test-installer.py target/dist/StalkShift-1.1.0-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stalkshift-windows-x64
          path: |
            target/dist/StalkShift-*-windows-x64.zip
            target/dist/SHA256SUMS.txt
          if-no-files-found: error
  portable:
    name: Portable capture parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo test -p stalkshift-capture -p stalkshift-core -p stalkshift-protocol --locked
